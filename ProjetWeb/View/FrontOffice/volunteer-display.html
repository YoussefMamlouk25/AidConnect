<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>AidConnect | Registered Volunteer</title>
      
      <link rel="stylesheet" href="assets/css/libs.min.css">
      <link rel="stylesheet" href="assets/css/socialv.css?v=4.0.0">
      <link rel="stylesheet" href="assets/vendor/@fortawesome/fontawesome-free/css/all.min.css">
      <link rel="stylesheet" href="assets/vendor/remixicon/fonts/remixicon.css">
      <link rel="stylesheet" href="assets/vendor/vanillajs-datepicker/dist/css/datepicker.min.css">
      <link rel="stylesheet" href="assets/vendor/font-awesome-line-awesome/css/all.min.css">
      <link rel="stylesheet" href="assets/vendor/line-awesome/dist/line-awesome/css/line-awesome.min.css">
      <link rel="stylesheet" href="assets/css/custom.css">
      <link rel="stylesheet" href="assets/vendor/sweetalert2/dist/sweetalert2.min.css">
      <link rel="stylesheet" href="assets/vendor/aos/dist/aos.css">
      <link rel="stylesheet" href="assets/css/rtl.css">
      <link rel="stylesheet" href="assets/vendor/bootstrap/dist/css/bootstrap.min.css">
  </head>
  <body class=" " style="background: white; overflow-y: auto;">
    <header class="header bg-white shadow-sm">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-4">
            <a href="#" class="d-flex align-items-center">
              <img src="assets/images/logo.png" alt="AidConnect Logo" class="img-fluid me-2" style="height: 40px;">
              <h4 class="mb-0 text-primary">AidConnect</h4>
            </a>
          </div>
          <div class="col-8 text-center">
            <button class="btn btn-outline-primary" onclick="window.location.href='volunteer-form.html'">Volunteer</button>
          </div>
        </div>
      </div>
    </header>
    <!-- Header END -->

      <div class="wrapper">
    <section class="volunteer-display-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 pt-5 pb-lg-0 pb-5 d-flex align-items-center justify-content-center">
                    <div class="sign-in-from bg-white p-4 rounded shadow-lg" style="max-width: 800px; width: 100%; border: 1px solid #e9ecef;">
                        <h1 class="mb-3 text-primary">Registered Volunteers</h1>
                        <p class="text-muted">Here are the volunteers who have registered with AidConnect.</p>

                        <!-- Search Bar -->
                        <div class="mb-4">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search by email or donation method..." style="border-radius: 20px; padding: 10px 15px;">
                        </div>

                        <!-- Empty State -->
                        <div id="emptyState" class="text-center py-5">
                            <i class="fas fa-users fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No Volunteers Yet</h4>
                            <p class="text-muted">Be the first to register as a volunteer!</p>
                            <a href="volunteer-form.html" class="btn btn-primary">Register Now</a>
                        </div>

                        <!-- Volunteers List -->
                        <div id="volunteersList" class="row" style="max-height: 400px; overflow-y: auto;">
                            <!-- Volunteers will be rendered here -->
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>
      </div>

    <!-- Footer -->
    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <p>&copy; 2025 AidConnect. All rights reserved.</p>
            <p><a href="volunteer-form.html" class="text-decoration-none">Register Volunteer</a> | <a href="volunteer-display.html" class="text-decoration-none">View Volunteers</a></p>
        </div>
    </footer>

    <!-- Backend Bundle JavaScript -->
    <script src="assets/js/libs.min.js"></script>
    <!-- slider JavaScript -->

    <script src="assets/js/slider.js"></script>
    <!-- masonry JavaScript -->
    <script src="assets/js/masonry.pkgd.min.js"></script>
    <!-- SweetAlert JavaScript -->
    <script src="assets/js/enchanter.js"></script>
    <!-- SweetAlert JavaScript -->
    <script src="assets/js/sweetalert.js"></script>
    <!-- app JavaScript -->
    <script src="assets/js/charts/weather-chart.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/vendor/vanillajs-datepicker/dist/js/datepicker.min.js"></script>
    <script src="assets/js/lottie.js"></script>
    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Volunteer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">

                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail">
                        </div>
                        <div class="mb-3">
                            <label for="editTelephone" class="form-label">Téléphone</label>
                            <input type="tel" class="form-control" id="editTelephone">
                        </div>
                        <div class="mb-3">
                            <label for="editResidence" class="form-label">Lieu de résidence</label>
                            <input type="text" class="form-control" id="editResidence">
                        </div>
                        <div class="mb-3">
                            <label for="editDonationMethod" class="form-label">Méthode de don</label>
                            <select class="form-control" id="editDonationMethod">
                                <option value="">-- Choisissez --</option>
                                <option value="cash">Cash</option>
                                <option value="card">Card</option>
                                <option value="online">Online</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="editDescription" rows="4" placeholder="Tell us about yourself and why you want to volunteer..." style="resize: vertical;"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentEditIndex = -1;
        let currentSearchTerm = '';

        function timeAgo(dateString) {
            if (!dateString) return 'Joined recently';
            const now = new Date();
            const past = new Date(dateString);
            const diffInMs = now - past;
            const diffInMinutes = Math.floor(diffInMs / (1000 * 60));
            const diffInHours = Math.floor(diffInMs / (1000 * 60 * 60));
            const diffInDays = Math.floor(diffInMs / (1000 * 60 * 60 * 24));

            if (diffInMinutes < 1) return 'Just now';
            if (diffInMinutes < 60) return `${diffInMinutes} minute${diffInMinutes > 1 ? 's' : ''} ago`;
            if (diffInHours < 24) return `${diffInHours} hour${diffInHours > 1 ? 's' : ''} ago`;
            if (diffInDays < 7) return `${diffInDays} day${diffInDays > 1 ? 's' : ''} ago`;
            return past.toLocaleDateString();
        }

        function renderVolunteers(volunteersToShow = null) {
            const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
            const container = document.getElementById('volunteersList');
            const emptyState = document.getElementById('emptyState');

            container.innerHTML = '';

            const baseVolunteers = volunteersToShow || volunteers;
            const displayVolunteers = currentSearchTerm ? baseVolunteers.filter(volunteer =>
                volunteer.email.toLowerCase().includes(currentSearchTerm) ||
                (volunteer.donationMethod && volunteer.donationMethod.toLowerCase().includes(currentSearchTerm)) ||
                (volunteer.description && volunteer.description.toLowerCase().includes(currentSearchTerm)) ||
                (volunteer.residence && volunteer.residence.toLowerCase().includes(currentSearchTerm))
            ) : baseVolunteers;

            if (displayVolunteers.length === 0) {
                if (volunteers.length === 0) {
                    emptyState.classList.remove('d-none');
                } else {
                    container.innerHTML = '<div class="col-12 text-center text-muted">No volunteers match your search.</div>';
                }
            } else {
                emptyState.classList.add('d-none');

                displayVolunteers.forEach((volunteer, index) => {
                    const originalIndex = volunteers.indexOf(volunteer);
                    const card = document.createElement('div');
                    card.className = 'col-12 mb-4';
                    card.style.animationDelay = `${index * 0.1}s`; // Stagger animation
                    card.innerHTML = `
                        <div class="card shadow-sm" style="border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px;">
                            <div class="card-body" style="padding: 15px;">
                                <div class="d-flex align-items-center mb-3">
                                    <img src="assets/images/user/user-01.jpg" alt="Avatar" class="rounded-circle me-3" style="width: 40px; height: 40px; border: 2px solid #e9ecef;">
                                    <div class="flex-grow-1">
                                        <h6 class="mb-0 fw-bold">User</h6>
                                        <small class="text-muted">Volunteer • ${timeAgo(volunteer.timestamp)}</small>
                                    </div>
                                    <div class="dropdown">
                                        <button class="btn btn-link text-muted p-0" type="button" data-bs-toggle="dropdown">
                                            <i class="fas fa-ellipsis-h"></i>
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item edit-btn" data-index="${originalIndex}" href="#"><i class="fas fa-edit me-2"></i>Edit</a></li>
                                            <li><a class="dropdown-item delete-btn" data-index="${originalIndex}" href="#"><i class="fas fa-trash me-2"></i>Delete</a></li>
                                        </ul>
                                    </div>
                                </div>
                                <div class="post-content mb-3">
                                    <p class="mb-2">${volunteer.description || "I'm User, excited to volunteer with AidConnect! 🎉"}</p>
                                    <p class="mb-1"><i class="fas fa-envelope text-primary me-1"></i>Email: ${volunteer.email}</p>
                                    <p class="mb-1"><i class="fas fa-phone text-primary me-2"></i>${volunteer.telephone}</p>
                                    <p class="mb-1"><i class="fas fa-map-marker-alt text-success me-2"></i>${volunteer.residence}</p>
                                    <p class="mb-0"><i class="fas fa-hand-holding-heart text-warning me-2"></i>Donation Method: ${volunteer.donationMethod}</p>
                                </div>
                                <div class="post-stats mb-2">
                                    <small class="text-muted">
                                        <span class="like-count">${volunteer.likes || 0}</span> likes • ${(volunteer.comments || []).length} comments
                                    </small>
                                </div>
                                <hr style="margin: 10px 0;">
                                <div class="d-flex justify-content-around">
                                    <button class="btn btn-link p-0 flex-fill like-btn ${volunteer.liked ? 'text-primary' : 'text-muted'}" data-index="${originalIndex}" style="text-decoration: none;">
                                        <i class="fas ${volunteer.liked ? 'fa-thumbs-up' : 'fa-thumbs-up'} me-1"></i> ${volunteer.liked ? 'Liked' : 'Like'}
                                    </button>
                                    <button class="btn btn-link text-muted p-0 flex-fill comment-btn" data-index="${originalIndex}" style="text-decoration: none;">
                                        <i class="fas fa-comment me-1"></i> Comment
                                    </button>

                                </div>
                                <div class="comments-section mt-3" id="comments-${originalIndex}" style="display: none;">
                                    <div class="comments-list mb-2" id="comments-list-${originalIndex}">
                                        ${(volunteer.comments || []).map((comment, commentIndex) => `
                                            <div class="d-flex mb-2 comment-item" data-comment-index="${commentIndex}">
                                                <img src="assets/images/user/user-01.jpg" alt="Commenter" class="rounded-circle me-2" style="width: 30px; height: 30px;">
                                                <div class="bg-light p-2 rounded flex-grow-1">
                                                    <div class="d-flex justify-content-between align-items-start">
                                                        <strong>${comment.author || 'Anonymous'}</strong>
                                                        ${comment.author === 'User' ? `
                                                            <div class="dropdown">
                                                                <button class="btn btn-sm btn-link text-muted p-0" type="button" data-bs-toggle="dropdown">
                                                                    <i class="fas fa-ellipsis-h"></i>
                                                                </button>
                                                                <ul class="dropdown-menu">
                                                                    <li><a class="dropdown-item edit-comment-btn" href="#" data-volunteer-index="${originalIndex}" data-comment-index="${commentIndex}"><i class="fas fa-edit me-2"></i>Edit</a></li>
                                                                    <li><a class="dropdown-item delete-comment-btn" href="#" data-volunteer-index="${originalIndex}" data-comment-index="${commentIndex}"><i class="fas fa-trash me-2"></i>Delete</a></li>
                                                                </ul>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                    <div class="comment-text">${comment.text}</div>
                                                    <div class="comment-edit d-none">
                                                        <input type="text" class="form-control form-control-sm comment-edit-input" value="${comment.text}">
                                                        <div class="mt-1">
                                                            <button class="btn btn-sm btn-primary save-comment-btn" data-volunteer-index="${originalIndex}" data-comment-index="${commentIndex}">Save</button>
                                                            <button class="btn btn-sm btn-secondary cancel-comment-btn" data-volunteer-index="${originalIndex}" data-comment-index="${commentIndex}">Cancel</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="d-flex">
                                        <img src="assets/images/user/user-01.jpg" alt="Your Avatar" class="rounded-circle me-2" style="width: 30px; height: 30px;">
                                        <div class="input-group">
                                            <input type="text" class="form-control comment-input border-0 bg-light" placeholder="Write a comment..." data-index="${originalIndex}" style="border-radius: 20px;">
                                            <button class="btn btn-primary add-comment-btn rounded-pill ms-2" data-index="${originalIndex}">Post</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Event listeners are now handled by event delegation below
            }
        }

        function editVolunteer(index) {
            const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
            const volunteer = volunteers[index];
            currentEditIndex = index;


            document.getElementById('editEmail').value = volunteer.email;
            document.getElementById('editTelephone').value = volunteer.telephone;
            document.getElementById('editResidence').value = volunteer.residence;
            document.getElementById('editDonationMethod').value = volunteer.donationMethod;
            document.getElementById('editDescription').value = volunteer.description || '';

            const modal = new bootstrap.Modal(document.getElementById('editModal'));
            modal.show();
        }

        document.getElementById('saveEditBtn').addEventListener('click', function() {
            if (currentEditIndex !== -1) {
                const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
                volunteers[currentEditIndex] = {
                    email: document.getElementById('editEmail').value,
                    telephone: document.getElementById('editTelephone').value,
                    residence: document.getElementById('editResidence').value,
                    donationMethod: document.getElementById('editDonationMethod').value,
                    description: document.getElementById('editDescription').value,
                    timestamp: volunteers[currentEditIndex].timestamp,
                    likes: volunteers[currentEditIndex].likes || 0,
                    comments: volunteers[currentEditIndex].comments || [],
                    liked: volunteers[currentEditIndex].liked || false
                };
                localStorage.setItem('volunteers', JSON.stringify(volunteers));
                renderVolunteers();
                const modal = bootstrap.Modal.getInstance(document.getElementById('editModal'));
                modal.hide();
                Swal.fire('Success!', 'Volunteer updated successfully!', 'success');
            }
        });

        function toggleLike(index) {
            const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
            if (volunteers[index].liked) {
                volunteers[index].likes = Math.max(0, (volunteers[index].likes || 0) - 1);
                volunteers[index].liked = false;
            } else {
                volunteers[index].likes = (volunteers[index].likes || 0) + 1;
                volunteers[index].liked = true;
            }
            localStorage.setItem('volunteers', JSON.stringify(volunteers));
            renderVolunteers();
        }

        function toggleComments(index) {
            const commentsSection = document.getElementById(`comments-${index}`);
            commentsSection.style.display = commentsSection.style.display === 'none' ? 'block' : 'none';
        }

        function addComment(index) {
            const commentInput = document.querySelector(`.comment-input[data-index="${index}"]`);
            const commentText = commentInput.value.trim();
            if (commentText) {
                const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
                if (!volunteers[index].comments) {
                    volunteers[index].comments = [];
                }
                volunteers[index].comments.push({ author: 'User', text: commentText });
                localStorage.setItem('volunteers', JSON.stringify(volunteers));
                commentInput.value = '';
                renderVolunteers();
            }
        }

        function deleteVolunteer(index) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    let volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
                    volunteers.splice(index, 1);
                    localStorage.setItem('volunteers', JSON.stringify(volunteers));
                    renderVolunteers();
                    Swal.fire('Deleted!', 'Volunteer has been deleted.', 'success');
                }
            });
        }

        function editComment(volunteerIndex, commentIndex) {
            const commentItem = document.querySelector(`#comments-${volunteerIndex} .comment-item[data-comment-index="${commentIndex}"]`);
            const commentText = commentItem.querySelector('.comment-text');
            const commentEdit = commentItem.querySelector('.comment-edit');
            commentText.classList.add('d-none');
            commentEdit.classList.remove('d-none');
        }

        function saveComment(volunteerIndex, commentIndex) {
            const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
            const commentItem = document.querySelector(`#comments-${volunteerIndex} .comment-item[data-comment-index="${commentIndex}"]`);
            const editInput = commentItem.querySelector('.comment-edit-input');
            const newText = editInput.value.trim();
            if (newText) {
                volunteers[volunteerIndex].comments[commentIndex].text = newText;
                localStorage.setItem('volunteers', JSON.stringify(volunteers));
                renderVolunteers();
            }
        }

        function cancelComment(volunteerIndex, commentIndex) {
            const commentItem = document.querySelector(`#comments-${volunteerIndex} .comment-item[data-comment-index="${commentIndex}"]`);
            const commentText = commentItem.querySelector('.comment-text');
            const commentEdit = commentItem.querySelector('.comment-edit');
            commentText.classList.remove('d-none');
            commentEdit.classList.add('d-none');
        }

        function deleteComment(volunteerIndex, commentIndex) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then((result) => {
                if (result.isConfirmed) {
                    const volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
                    volunteers[volunteerIndex].comments.splice(commentIndex, 1);
                    localStorage.setItem('volunteers', JSON.stringify(volunteers));
                    renderVolunteers();
                    Swal.fire('Deleted!', 'Comment has been deleted.', 'success');
                }
            });
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            currentSearchTerm = this.value.toLowerCase();
            renderVolunteers();
        });

        // Event delegation for dynamic buttons
        document.addEventListener('click', function(e) {
            const target = e.target;

            if (target.classList.contains('edit-btn') || target.closest('.edit-btn')) {
                const btn = target.classList.contains('edit-btn') ? target : target.closest('.edit-btn');
                const index = btn.getAttribute('data-index');
                editVolunteer(index);
            }

            if (target.classList.contains('delete-btn') || target.closest('.delete-btn')) {
                const btn = target.classList.contains('delete-btn') ? target : target.closest('.delete-btn');
                const index = btn.getAttribute('data-index');
                deleteVolunteer(index);
            }

            if (target.classList.contains('like-btn') || target.closest('.like-btn')) {
                const btn = target.classList.contains('like-btn') ? target : target.closest('.like-btn');
                const index = btn.getAttribute('data-index');
                toggleLike(index);
            }

            if (target.classList.contains('comment-btn') || target.closest('.comment-btn')) {
                const btn = target.classList.contains('comment-btn') ? target : target.closest('.comment-btn');
                const index = btn.getAttribute('data-index');
                toggleComments(index);
            }

            if (target.classList.contains('add-comment-btn') || target.closest('.add-comment-btn')) {
                const btn = target.classList.contains('add-comment-btn') ? target : target.closest('.add-comment-btn');
                const index = btn.getAttribute('data-index');
                addComment(index);
            }

            if (target.classList.contains('edit-comment-btn') || target.closest('.edit-comment-btn')) {
                const btn = target.classList.contains('edit-comment-btn') ? target : target.closest('.edit-comment-btn');
                const volunteerIndex = btn.getAttribute('data-volunteer-index');
                const commentIndex = btn.getAttribute('data-comment-index');
                editComment(volunteerIndex, commentIndex);
            }

            if (target.classList.contains('delete-comment-btn') || target.closest('.delete-comment-btn')) {
                const btn = target.classList.contains('delete-comment-btn') ? target : target.closest('.delete-comment-btn');
                const volunteerIndex = btn.getAttribute('data-volunteer-index');
                const commentIndex = btn.getAttribute('data-comment-index');
                deleteComment(volunteerIndex, commentIndex);
            }

            if (target.classList.contains('save-comment-btn') || target.closest('.save-comment-btn')) {
                const btn = target.classList.contains('save-comment-btn') ? target : target.closest('.save-comment-btn');
                const volunteerIndex = btn.getAttribute('data-volunteer-index');
                const commentIndex = btn.getAttribute('data-comment-index');
                saveComment(volunteerIndex, commentIndex);
            }

            if (target.classList.contains('cancel-comment-btn') || target.closest('.cancel-comment-btn')) {
                const btn = target.classList.contains('cancel-comment-btn') ? target : target.closest('.cancel-comment-btn');
                const volunteerIndex = btn.getAttribute('data-volunteer-index');
                const commentIndex = btn.getAttribute('data-comment-index');
                cancelComment(volunteerIndex, commentIndex);
            }
        });

        window.onload = function() {
            renderVolunteers();
        };
    </script>
  </body>
</html>
