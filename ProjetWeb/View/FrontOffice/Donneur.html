<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offre volontaire - AidConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="donneur.html" class="logo">AidConnect</a>
      <div class="nav-links">
        <a href="donneur.html" class="active">Offre volontaire</a>
        <a href="post.html">Update volontaire</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Enregistrez un nouveau volontaire</h1>

    <form id="donorForm" novalidate>
      <label for="lastName">Nom *</label>
      <input type="text" id="lastName" name="lastName" required>

      <label for="firstName">Prénom *</label>
      <input type="text" id="firstName" name="firstName" required>

      <label for="age">Âge *</label>
      <input type="number" id="age" name="age" min="18" max="100" required>

      <label for="nationalId">Numéro de carte d'identité nationale *</label>
      <input type="text" id="nationalId" name="nationalId" pattern="^[A-Za-z0-9]+$" required>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Téléphone *</label>
      <input type="tel" id="phone" name="phone" pattern="^\\+?\\d{7,15}$" placeholder="+212600000000" required>

      <label for="address">Lieu de résidence *</label>
      <input type="text" id="address" name="address" required>

      <label for="donationMethod">Méthode de don *</label>
      <select id="donationMethod" name="donationMethod" required>
        <option value="">-- Choisissez --</option>
        <option value="sang">Don de sang</option>
        <option value="argent">Don d'argent</option>
        <option value="nourriture">Don de nourriture</option>
        <option value="vetements">Don de vêtements</option>
      </select>

      <button type="submit">Enregistrer</button>
      <div id="successMessage"> Donneur enregistré avec succès !</div>
    </form>
  </main>

  <script src="donneur.js"></script>
</body>
</html>
