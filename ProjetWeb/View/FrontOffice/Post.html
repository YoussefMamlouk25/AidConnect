<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donner mon avis - AidConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <a href="donneur.html" class="logo">AidConnect</a>
      <div class="nav-links">
        <a href="donneur.html">Faire un don</a>
        <a href="post.html" class="active">Donner mon avis</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Partagez votre avis ou votre expérience</h1>

    <!-- Formulaire -->
    <form id="opinionForm">
      <label for="title">Titre *</label>
      <input type="text" id="title" name="title" required minlength="3">

      <label for="author">Nom complet *</label>
      <input type="text" id="author" name="author" required pattern="[A-Za-zÀ-ÿ\\s]{3,}">

      <label for="location">Localisation *</label>
      <input type="text" id="location" name="location" placeholder="Ex: Casablanca, Maroc" required>

      <label for="opinion">Votre avis *</label>
      <textarea id="opinion" name="opinion" rows="5" required minlength="10" placeholder="Exprimez votre expérience ici..."></textarea>

      <button type="submit">Publier mon avis</button>
      <div id="successMessage">✅ Merci pour votre avis !</div>
    </form>

    <!-- Section des avis publiés -->
    <section id="postsSection">
      <h2>Publications récentes</h2>
      <div id="postList" class="post-grid">
        <!-- Les posts s’ajoutent ici dynamiquement -->
      </div>
    </section>
  </main>

  <script src="Post.js"></script>
</body>
</html>
