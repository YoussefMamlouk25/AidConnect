<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Post Problème Résolu</title>
</head>
<body>
    <div class="container">
  <div class="sidebar">
  <button onclick="window.location.href='addpost.html'">Ajouter un Post</button>
  <button onclick="window.location.href='addpostupdate.html'">Ajouter un Post Résolu</button>
</div>

<div class="main-content">

<form>
  <center>
    <h1>Publier un Problème Résolu</h1>

    <form action="" method="post">
      <p>
        <label>Titre du post résolu : 
          <input type="text" name="titre">
        </label>
      </p>

      <p>
        <label>Description du problème résolu :<br>
          <textarea name="description" rows="5"></textarea>
        </label>
      </p>

      <p>
        <label>Emplacement (ville) : 
          <select name="ville">
            <option value="">-- Sélectionner la ville --</option>
            <option value="Ariana">Ariana</option>
            <option value="Béja">Béja</option>
            <option value="Ben Arous">Ben Arous</option>
            <option value="Bizerte">Bizerte</option>
            <option value="Gabès">Gabès</option>
            <option value="Gafsa">Gafsa</option>
            <option value="Jendouba">Jendouba</option>
            <option value="Kairouan">Kairouan</option>
            <option value="Kasserine">Kasserine</option>
            <option value="Kébili">Kébili</option>
            <option value="Le Kef">Le Kef</option>
            <option value="Mahdia">Mahdia</option>
            <option value="Manouba">Manouba</option>
            <option value="Médenine">Médenine</option>
            <option value="Monastir">Monastir</option>
            <option value="Nabeul">Nabeul</option>
            <option value="Sfax">Sfax</option>
            <option value="Sidi Bouzid">Sidi Bouzid</option>
            <option value="Siliana">Siliana</option>
            <option value="Sousse">Sousse</option>
            <option value="Tataouine">Tataouine</option>
            <option value="Tozeur">Tozeur</option>
            <option value="Tunis">Tunis</option>
            <option value="Zaghouan">Zaghouan</option>
          </select>
        </label>
      </p>

      <p>
        <label>Intervention réalisée par : 
          <input type="text" name="intervention">
        </label>
      </p>

      <p>
        <label>Date de résolution : 
          <input type="date" name="dateResolu">
        </label>
      </p>

      <p>
        <label>Temps pour répondre (jours) : 
          <input type="number" name="joursReponse" >
        </label>
      </p>

      <p>
        <label>Temps pour résoudre (jours) : 
          <input type="number" name="joursResolution" >
        </label>
      </p>

      <p>
        <button type="submit">Publier le post résolu</button>
      </p>
    </form>
  </center>
   <script src="addpostupdate.js"></script>
   <link rel="stylesheet" href="addpostupdate.css">
</form>

</div>  
</div>
</body>
</html>
